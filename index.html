<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BTCUSDT v1</title>
<meta name="theme-color" content="#0b1020">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#0a0f1e;--s1:#0f1629;--s2:#141d36;--s3:#1a2544;--line:#1f2a4a;--line2:#2a3760;
  --ink:#e7eaf3;--mut:#8b95b5;--dim:#5e6888;
  --up:#2ec4a6;--dn:#ef6189;--acc:#5b8cff;--warn:#f2c94c;
  --r:10px;--hh:48px;--pw:340px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}

/* header: satu baris */
header{height:var(--hh);flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--s1);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;white-space:nowrap;position:relative}
header::-webkit-scrollbar{display:none}
.brand{font-weight:700;letter-spacing:-.01em;font-size:14px;margin-right:4px}
.brand span{color:var(--mut);font-weight:500}
.ctl{height:30px;background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:0 26px 0 10px;font-weight:600;font-size:12.5px;outline:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(100% - 13px) 13px,calc(100% - 9px) 13px;background-size:4px 4px;background-repeat:no-repeat;transition:border-color .2s}
.ctl:hover,.ctl:focus{border-color:var(--line2)}
.seg{position:relative;display:flex;height:30px;background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:2px;flex:none}
.seg button{position:relative;z-index:1;border:0;background:none;padding:0 10px;font-size:12px;font-weight:600;color:var(--mut);border-radius:6px;transition:color .2s}
.seg button.on{color:var(--ink)}
.seg .ind{position:absolute;top:2px;bottom:2px;border-radius:6px;background:var(--s3);box-shadow:inset 0 0 0 1px var(--line2);transition:transform .3s var(--ease),width .3s var(--ease)}
.sp{flex:1;min-width:8px}
.quote{display:flex;align-items:baseline;gap:8px}
.quote .p{font-size:15px;font-weight:600}
.quote .c{font-size:12px;font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;background:var(--up);flex:none;align-self:center;transition:background .3s}
.dot.off{background:var(--dn)}
.icon{width:30px;height:30px;flex:none;display:grid;place-items:center;border:1px solid var(--line);background:var(--s2);border-radius:8px;transition:background .2s}
.icon:hover{background:var(--s3)}
.icon svg{width:15px;height:15px;stroke:var(--ink);fill:none;stroke-width:1.6}
.prog{position:absolute;left:0;bottom:-1px;height:2px;width:30%;background:var(--acc);opacity:0;transform:translateX(-100%)}
body.busy .prog{opacity:1;animation:prog 1s var(--ease) infinite}
@keyframes prog{to{transform:translateX(400%)}}

/* layout 100% layar */
.app{flex:1;min-height:0;display:flex}
.chart{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;transition:opacity .35s var(--ease),filter .35s var(--ease)}
body.busy .chart{opacity:.45;filter:saturate(.6)}
.pn{position:relative;min-height:0}
.pn.a{flex:6}.pn.b{flex:1.7;border-top:1px solid var(--line)}.pn.c{flex:1.3;border-top:1px solid var(--line)}
.pn>.lc{position:absolute;inset:0}
.lab{position:absolute;left:10px;top:7px;z-index:3;pointer-events:none;font-size:11px;color:var(--mut);max-width:calc(100% - 100px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lab b{color:var(--ink);font-weight:600}
#ov{position:absolute;inset:0;z-index:2;pointer-events:none}
.tag{position:absolute;z-index:4;pointer-events:none;display:none;transform:translate(-50%,-100%);padding:5px 9px;border-radius:7px;white-space:nowrap;
  background:rgba(10,15,30,.86);border:1px solid var(--warn);box-shadow:0 0 0 3px rgba(242,201,76,.12);font-size:11.5px;transition:left .3s var(--ease),top .3s var(--ease)}
.tag b{color:var(--warn);font-weight:700;margin-right:6px}
.tag.s{border-color:var(--dn);box-shadow:0 0 0 3px rgba(239,97,137,.12)}.tag.s b{color:var(--dn)}
.end{position:absolute;right:92px;bottom:8px;z-index:5;width:26px;height:26px;border-radius:7px;border:1px solid var(--line2);background:var(--s2);display:grid;place-items:center;opacity:.8;transition:opacity .2s}
.end:hover{opacity:1}.end svg{width:13px;height:13px;stroke:var(--ink);fill:none;stroke-width:1.8}
.err{position:absolute;inset:auto 12px 12px auto;z-index:6;background:var(--s2);border:1px solid var(--dn);border-radius:8px;padding:6px 10px;font-size:12px;display:none}

/* panel */
.side{width:var(--pw);flex:none;display:flex;flex-direction:column;gap:8px;padding:8px;border-left:1px solid var(--line);background:var(--s1);min-height:0}
.card{background:var(--s2);border:1px solid var(--line);border-radius:var(--r);padding:12px;flex:none}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.fadein{animation:fi .35s var(--ease)}
@keyframes fi{from{opacity:0;transform:translateY(3px)}}

.pill{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:700;letter-spacing:.02em}
.pill.l{background:rgba(46,196,166,.14);color:var(--up)}.pill.s{background:rgba(239,97,137,.14);color:var(--dn)}
.pill.n{background:var(--s3);color:var(--mut)}.pill.w{background:rgba(242,201,76,.13);color:var(--warn)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:10px}
.kv div{min-width:0}.kv i{display:block;font-style:normal;font-size:11px;color:var(--mut)}
.kv span{font-size:13px;font-weight:600}
.pl{display:flex;align-items:baseline;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.pl .v{font-size:18px;font-weight:600}
.rail{position:relative;height:4px;border-radius:4px;margin:12px 0 4px;background:linear-gradient(90deg,var(--dn),#8d7bd6 50%,var(--up))}
.rail .t{position:absolute;top:-4px;width:2px;height:12px;background:var(--ink);opacity:.6;transform:translateX(-1px)}
.rail .k{position:absolute;top:-5px;width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--s2);transform:translateX(-7px);transition:left .5s var(--ease)}
.rl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut)}
.flat{color:var(--mut);margin-top:8px}

.eqrow{display:flex;align-items:baseline;gap:8px}
.eqv{font-size:24px;font-weight:600;letter-spacing:-.01em}
#eqc{display:block;width:100%;height:48px;margin:6px 0}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.st div{background:var(--s1);border-radius:7px;padding:6px 8px}
.st i{display:block;font-style:normal;font-size:10.5px;color:var(--mut)}
.st span{font-size:13px;font-weight:600}
.sq{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px;max-height:23px;overflow:hidden;flex-direction:row-reverse;justify-content:flex-end}
.sq b{width:8px;height:8px;border-radius:2px;background:var(--up);opacity:.85}
.sq b.x{background:var(--dn)}.sq b.o{background:none;box-shadow:inset 0 0 0 1.5px var(--warn)}

.tabs{flex:1;min-height:0;display:flex;flex-direction:column;padding:0}
.tb{position:relative;display:flex;border-bottom:1px solid var(--line);flex:none}
.tb button{flex:1;border:0;background:none;padding:10px 0 9px;font-size:12px;font-weight:600;color:var(--mut);transition:color .2s}
.tb button.on{color:var(--ink)}
.tb .ind{position:absolute;bottom:-1px;height:2px;background:var(--acc);border-radius:2px;transition:transform .3s var(--ease),width .3s var(--ease)}
.tb .mo{display:none}
.body{flex:1;min-height:0;overflow:auto;padding:8px 10px 10px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.sec{display:none}.sec.on{display:block;animation:fi .3s var(--ease)}

.tr{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:0}
.tr .b{font-size:10px;font-weight:700;text-align:center;border-radius:4px;padding:2px 0}
.tr .b.tp{background:rgba(46,196,166,.14);color:var(--up)}.tr .b.sl{background:rgba(239,97,137,.14);color:var(--dn)}.tr .b.op{background:rgba(242,201,76,.13);color:var(--warn)}
.tr .m{font-size:12px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .m i{font-style:normal;color:var(--mut);font-size:11px;display:block}
.tr .r{text-align:right;font-size:12px;font-weight:600}
.tr .r i{display:block;font-style:normal;font-size:11px;color:var(--mut);font-weight:500}
.empty{color:var(--mut);padding:14px 2px}
table.vt{width:100%;border-collapse:collapse;font-size:12px}
.vt th{font-weight:500;color:var(--mut);text-align:right;padding:6px 4px;font-size:11px}
.vt td{text-align:right;padding:7px 4px;border-top:1px solid var(--line)}
.vt th:first-child,.vt td:first-child{text-align:left}
.vd{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--mut)}
.rules{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:12px}
.rules i{font-style:normal;color:var(--mut)}

/* Mata Dewa */
.dw{border-color:rgba(91,140,255,.35);background:linear-gradient(180deg,rgba(91,140,255,.10),rgba(91,140,255,.02)),var(--s2)}
.dw .hd span{color:var(--acc)}
.dwr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;font-size:12.5px}
.dwr>i{font-style:normal;color:var(--mut)}
.dwr b{font-weight:600}
.plan{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--s1);border:1px dashed var(--line2);font-size:12px;line-height:1.5}
.plan b{font-weight:600}
.meter{height:4px;border-radius:4px;background:var(--s1);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .6s var(--ease)}
.foot{font-size:11px;color:var(--dim);margin-top:6px}
#eyeBtn.on{border-color:var(--acc);background:rgba(91,140,255,.16)}
/* drawer pengaturan */
.dr{position:fixed;inset:0;z-index:50;pointer-events:none}
.dr .bk{position:absolute;inset:0;background:rgba(5,8,18,.5);opacity:0;transition:opacity .3s}
.dr .bx{position:absolute;right:0;top:0;bottom:0;width:min(360px,100%);background:var(--s1);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s var(--ease)}
.dr.on{pointer-events:auto}.dr.on .bk{opacity:1}.dr.on .bx{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600}
.fs{flex:1;overflow:auto;padding:6px 16px}
.f{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.f label{color:var(--mut)}
.f input,.f select{width:120px;height:30px;background:var(--s2);border:1px solid var(--line);border-radius:7px;padding:0 8px;text-align:right;outline:none;font-family:'JetBrains Mono',monospace;font-size:12.5px}
.f select{text-align:left;font-family:inherit}
.f input:focus,.f select:focus{border-color:var(--acc)}
.sw{width:36px;height:20px;border-radius:10px;border:0;background:var(--line2);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.sw.on{background:var(--dn)}.sw.on::after{transform:translateX(16px)}
.note{font-size:11.5px;color:var(--mut);padding:10px 0}
.df{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.bt{flex:1;height:34px;border-radius:8px;border:1px solid var(--line2);background:var(--s2);font-weight:600}
.bt.p{background:var(--acc);border-color:var(--acc);color:#fff}

@media (max-width:820px){
  :root{--hh:46px}
  header{padding:0 8px;gap:5px}
  .brand,.quote,.sp{display:none}
  .ctl{padding:0 20px 0 7px;font-size:12px;background-position:calc(100% - 11px) 13px,calc(100% - 7px) 13px;min-width:0;flex:1 1 auto;width:0}
  #sym{flex-basis:62px}#preset{flex-basis:100px}
  .seg button{padding:0 5px;font-size:11.5px}
  .app{flex-direction:column}
  .chart{flex:1.15}
  .side{width:auto;flex:1;border-left:0;border-top:1px solid var(--line);padding:0;gap:0}
  .side>.card:not(.tabs){display:none}
  .dw{border:0;background:none;padding:0}
  .tabs{border:0;border-radius:0;background:var(--s1)}
  .tb .mo{display:block}
  .end{right:84px}
  .pn.b{flex:1.5}.pn.c{display:none}
}
@media (max-height:760px) and (min-width:821px){#eqc{height:40px}.card{padding:10px}.kv{gap:6px 12px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">BTCUSDT <span>v1</span></div>
  <select id="sym" class="ctl" aria-label="Simbol"></select>
  <div class="seg" id="tfs"><span class="ind"></span></div>
  <select id="preset" class="ctl" aria-label="Preset"></select>
  <div class="sp"></div>
  <div class="quote"><span class="dot off" id="dot"></span><span class="p num" id="px">—</span><span class="c num" id="pc"></span></div>
  <button class="icon" id="eyeBtn" aria-label="Mata Dewa" title="Proyeksi Mata Dewa"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  <button class="icon" id="setBtn" aria-label="Pengaturan"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  <div class="prog"></div>
</header>

<div class="app">
  <section class="chart">
    <div class="pn a"><div class="lc" id="c1"></div><canvas id="ov"></canvas><div class="lab" id="lab1"></div><div class="tag" id="tag"></div>
      <button class="end" id="end" aria-label="Ke bar terakhir"><svg viewBox="0 0 24 24"><path d="M6 6l6 6-6 6M14 6l6 6-6 6"/></svg></button></div>
    <div class="pn b"><div class="lc" id="c2"></div><div class="lab">MACD 12 26 9</div></div>
    <div class="pn c"><div class="lc" id="c3"></div><div class="lab">RSI 14</div></div>
    <div class="err" id="err"></div>
  </section>

  <aside class="side">
    <div class="card dw" id="cDewa"></div>
    <div class="card" id="cPos"></div>
    <div class="card" id="cEq"></div>
    <div class="card tabs">
      <div class="tb" id="tb">
        <button class="mo" data-t="dewa">Dewa</button><button class="mo" data-t="pos">Posisi</button><button class="mo" data-t="eq">Ekuitas</button>
        <button data-t="hist">Riwayat</button><button data-t="val">Uji</button><button data-t="rule">Aturan</button><span class="ind"></span>
      </div>
      <div class="body">
        <div class="sec" data-s="dewa" id="mDewa"></div>
        <div class="sec" data-s="pos" id="mPos"></div>
        <div class="sec" data-s="eq" id="mEq"></div>
        <div class="sec" data-s="hist" id="sHist"></div>
        <div class="sec" data-s="val" id="sVal"></div>
        <div class="sec" data-s="rule" id="sRule"></div>
      </div>
    </div>
  </aside>
</div>

<div class="dr" id="dr"><div class="bk" data-x></div><div class="bx">
  <div class="dh">Pengaturan<button class="icon" data-x aria-label="Tutup"><svg viewBox="0 0 24 24" data-x><path d="M6 6l12 12M18 6L6 18" data-x/></svg></button></div>
  <div class="fs">
    <div class="f"><label>Entry</label><select id="f_entry"></select></div>
    <div class="f"><label>Arah</label><select id="f_dir"><option value="L">Long</option><option value="LS">Long + Short</option></select></div>
    <div class="f"><label>Target × ATR</label><input type="number" id="f_tpk" step="0.05" min="0.05"></div>
    <div class="f"><label>Stop × ATR</label><input type="number" id="f_slk" step="0.05" min="0.05"></div>
    <div class="f"><label>Batas bar (0 = tanpa)</label><input type="number" id="f_mb" step="1" min="0"></div>
    <div class="f"><label>Margin %</label><input type="number" id="f_mg" step="1" min="1" max="100"></div>
    <div class="f"><label>Leverage</label><input type="number" id="f_lev" step="1" min="1" max="125"></div>
    <div class="f"><label>Fee per sisi %</label><input type="number" id="f_fee" step="0.005" min="0"></div>
    <div class="f"><label>Modal $</label><input type="number" id="f_cap" step="100" min="10"></div>
    <div class="f"><label>Periode</label><select id="f_per"><option value="7">7 hari</option><option value="30">30 hari</option><option value="90">90 hari</option><option value="180">180 hari</option><option value="365">1 tahun</option><option value="0">Semua</option></select></div>
    <div class="f"><label>Tangga margin</label><button class="sw" id="f_lad" type="button" aria-label="Tangga margin"></button></div>
    <div class="f"><label>Setelah SL beruntun</label><input type="number" id="f_ladn" step="1" min="1"></div>
    <div class="f"><label>Margin tangga %</label><input type="number" id="f_ladm" step="5" min="1" max="100"></div>
    <p class="note">Tangga margin adalah martingale dan dapat menghabiskan modal. Simulasi dari data Binance, bukan saran investasi.</p>
  </div>
  <div class="df"><button class="bt" id="f_reset">Reset</button><button class="bt p" id="f_ok">Terapkan</button></div>
</div></div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem('btcv1.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('btcv1.'+k,JSON.stringify(v))}catch(e){}}};
const SYMS=['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','LINKUSDT','SUIUSDT','AVAXUSDT'];
const TFS=[['15m','15m'],['30m','30m'],['1h','1H'],['4h','4H'],['1d','1D']];
const TFMS={'15m':9e5,'30m':18e5,'1h':36e5,'4h':144e5,'1d':864e5};

/* sinyal dibaca di close bar i → entry di open bar i+1 */
const up=(X,i)=>X.c[i]>X.e200[i]&&X.e50[i]>X.e200[i], dw=(X,i)=>X.c[i]<X.e200[i]&&X.e50[i]<X.e200[i];
const htf=(X,i)=>up(X,i)&&X.c[i]>X.e800[i]&&X.e200[i]>X.e800[i], atrp=(X,i)=>X.atr[i]/X.c[i];
const ENTRIES={
  hist_rise:{n:'MACD histogram naik',r:'Histogram MACD naik / turun dari bar sebelumnya',f:(X,i)=>X.hi[i]>X.hi[i-1]?1:X.hi[i]<X.hi[i-1]?-1:0},
  rsi2_trend:{n:'RSI2 pullback tren',r:'Tren naik (close & EMA50 > EMA200), RSI(2) < 10 · short kebalikannya (> 90)',f:(X,i)=>up(X,i)&&X.rsi2[i]<10?1:dw(X,i)&&X.rsi2[i]>90?-1:0},

function ema(a,n){const k=2/(n+1),o=[a[0]];for(let i=1;i<a.length;i++)o.push(o[i-1]+k*(a[i]-o[i-1]));return o}
function rma(a,n){const o=new Array(a.length);let s=0;for(let i=0;i<a.length;i++){if(i<n){s+=a[i];o[i]=s/(i+1)}else o[i]=o[i-1]+(a[i]-o[i-1])/n}return o}
function calc(d){
  const o=d.map(r=>r.o),h=d.map(r=>r.h),l=d.map(r=>r.l),c=d.map(r=>r.c);
  const tr=c.map((x,i)=>i?Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])):h[i]-l[i]);
  const e12=ema(c,12),e26=ema(c,26),m=e12.map((x,i)=>x-e26[i]),s=ema(m,9);
  const ch=c.map((x,i)=>i?x-c[i-1]:0);
  const RS={},rsi=n=>{const g=rma(ch.map(x=>Math.max(x,0)),n),L=rma(ch.map(x=>Math.max(-x,0)),n);RS[n]=[g,L];return g.map((x,i)=>100-100/(1+x/(L[i]||1e-12)))};
  const r14=rsi(14),r2=rsi(2);
  const bbl=[],bbu=[];
  for(let i=0;i<c.length;i++){const a=Math.max(0,i-19);let sm=0,q=0;for(let j=a;j<=i;j++)sm+=c[j];const mu=sm/(i-a+1);for(let j=a;j<=i;j++)q+=(c[j]-mu)**2;const sd=Math.sqrt(q/(i-a+1));
    const ma=i>=19?mu:sm/20;bbl.push(ma-2*sd);bbu.push(ma+2*sd)}
  return {o,h,l,c,atr:rma(tr,14),m,s,hi:m.map((x,i)=>x-s[i]),rsi:r14,rsi2:r2,e20:ema(c,20),e50:ema(c,50),e200:ema(c,200),e800:ema(c,800),bbl,bbu,
    e12,e26,ag14:RS[14][0],al14:RS[14][1],ag2:RS[2][0],al2:RS[2][1]};
}

/* backtest — sama dengan skrip riset */
function backtest(p,from,to,live){
  const sig=ENTRIES[p.entry].f,lev=p.lev,fee=p.fee/100;
  let eq=p.cap,peak=eq,mdd=0,streak=0,i=Math.max(from,201),open=null;const T=[],curve=[eq];
  while(i<to-1){
    let s=sig(X,i);if(p.dir==='L'&&s<0)s=0;
    if(!s){i++;continue}
    const e=X.o[i+1],a=X.atr[i],tp=e+s*p.tpk*a,sl=e-s*p.slk*a,mg=(p.lad&&streak>=p.ladn?p.ladm:p.mg)/100;
    let j=i+1,res=null;
    for(;j<to;j++){
      const hs=s>0?X.l[j]<=sl:X.h[j]>=sl,ht=s>0?X.h[j]>=tp:X.l[j]<=tp;
      if(live&&j===to-1&&!hs&&!ht)break;
      if(hs){res=['SL',sl];break}
      if(ht){res=['TP',tp];break}
      if(p.mb&&j-i>=p.mb&&!(live&&j===to-1)){res=['T',X.c[j]];break}
    }
    const b={dir:s,si:i,ei:i+1,entry:e,tp,sl,atr:a,mg,eq0:eq,lad:mg*100>p.mg};
    if(!res){if(live)open=b;break}
    const gross=s*(res[1]-e)/e*mg*lev,fr=fee*2*mg*lev,net=gross-fr;
    eq=Math.max(eq*(1+net),0);peak=Math.max(peak,eq);mdd=Math.max(mdd,1-eq/peak);
    T.push(Object.assign(b,{type:res[0],exit:res[1],xi:j,bars:j-i,gross,fr,net,eq}));curve.push(eq);
    streak=net<0?streak+1:0;i=j;if(eq<=0)break;
  }
  const w=T.filter(t=>t.net>0).length;
  return {T,open,eq,ret:eq/p.cap-1,mdd,wr:T.length?w/T.length:0,w,streak,curve};
}

  const o=BT.open;if(o&&(o.dir>0?(l.l<=o.sl||l.h>=o.tp):(l.h>=o.sl||l.l<=o.tp))){recompute(true,true);return}
  head();PL=plan();renderDewa();
  if(o){const mg=o.mg,fl=o.dir*(l.c-o.entry)/o.entry*mg*P.lev-P.fee/100*2*mg*P.lev,lo=Math.min(o.sl,o.tp),hi=Math.max(o.sl,o.tp);
    document.querySelectorAll('#fl').forEach(e=>{e.textContent=pc(fl)+' · '+fd(o.eq0*(1+fl));e.className='v num '+(fl>=0?'up':'dn')});
    document.querySelectorAll('#lp').forEach(e=>e.textContent=fp(l.c));
    document.querySelectorAll('#kn').forEach(e=>e.style.left=Math.min(100,Math.max(0,(l.c-lo)/(hi-lo)*100))+'%');
    document.querySelectorAll('[data-c]').forEach(curve)}
  drawOv();
}
function toEnd(){const n=D.length,w=$('c1').clientWidth,show=Math.max(40,Math.min(160,Math.round(w/8))),ex=S.eye?PH+6:5,r={from:n-show,to:n+ex};[c1,c2,c3].forEach(c=>c.timeScale().setVisibleLogicalRange(r))}
async function load(){
  const my=++seq;document.body.classList.add('busy');clearInterval(pollT);$('err').style.display='none';
  try{
    const d=await loadAll(S.sym,S.tf);if(my!==seq)return;if(d.length<300)throw new Error('data kurang');
    D=d;lastEq=null;DW=null;dwKey='';recompute(false,true);toEnd();requestAnimationFrame(()=>requestAnimationFrame(toEnd));
    $('dot').classList.remove('off');pollT=setInterval(poll,5000);
  }catch(e){$('err').textContent='Gagal memuat data · mencoba lagi';$('err').style.display='block';$('dot').classList.add('off');setTimeout(()=>my===seq&&load(),6000)}
  finally{if(my===seq)document.body.classList.remove('busy')}
}
async function poll(){
  const my=seq;
  try{const d=(await kl(`symbol=${S.sym}&interval=${S.tf}&limit=2`)).map(bar);if(my!==seq||!D.length)return;$('dot').classList.remove('off');
    let nb=false;d.forEach(b=>{const L=D[D.length-1];if(b.t===L.t)D[D.length-1]=b;else if(b.t>L.t){D.push(b);nb=true}});nb?recompute(true,false):tick()}
  catch(e){$('dot').classList.add('off')}
}

/* kontrol */
function moveInd(box,btn){const ind=box.querySelector('.ind');if(!btn||!ind)return;ind.style.width=btn.offsetWidth+'px';ind.style.transform=`translateX(${btn.offsetLeft-(box.classList.contains('seg')?0:0)}px)`}
$('tfs').insertAdjacentHTML('beforeend',TFS.map(([k,l])=>`<button data-tf="${k}">${l}</button>`).join(''));
$('sym').innerHTML=SYMS.map(s=>`<option value="${s}" ${s===S.sym?'selected':''}>${s.replace('USDT','')}</option>`).join('');
function presetOpts(){$('preset').innerHTML=`<option value="default">Default</option><option value="optimal">Optimal</option><option value="dewa">Mata Dewa</option>${S.preset==='custom'?'<option value="custom">Kustom</option>':''}`;$('preset').value=S.preset}
$('f_entry').innerHTML=Object.entries(ENTRIES).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('');
function markTf(){const b=[...$('tfs').querySelectorAll('button')];b.forEach(x=>x.classList.toggle('on',x.dataset.tf===S.tf));moveInd($('tfs'),b.find(x=>x.dataset.tf===S.tf))}
function setTab(t){
  const mob=innerWidth<=820;if(!mob&&(t==='pos'||t==='eq'||t==='dewa'))t='hist';S.tab=t;
  document.querySelectorAll('#tb button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.dataset.s===t));
  moveInd($('tb'),$('tb').querySelector(`[data-t="${t}"]`));if(t==='eq')document.querySelectorAll('[data-c]').forEach(curve);save();
}
const save=()=>{LS.set('s2',S);if(S.preset==='custom')LS.set('custom',P)};
$('tfs').onclick=e=>{const tf=e.target.dataset.tf;if(!tf||tf===S.tf)return;S.tf=tf;if(S.preset==='optimal'||S.preset==='dewa')P=presetFor(S.preset,tf);presetOpts();markTf();save();load()};
$('sym').onchange=e=>{S.sym=e.target.value;save();load()};
$('preset').onchange=e=>{S.preset=e.target.value;if(S.preset!=='custom')P=presetFor(S.preset,S.tf);presetOpts();save();
  document.body.classList.add('busy');setTimeout(()=>{if(D.length)recompute(true,true);document.body.classList.remove('busy')},180)};
$('tb').onclick=e=>{if(e.target.dataset.t)setTab(e.target.dataset.t)};
$('end').onclick=toEnd;
function eye(){$('eyeBtn').classList.toggle('on',!!S.eye);[c1,c2,c3].forEach(c=>c.timeScale().applyOptions({rightOffset:S.eye?PH+6:6}));drawOv()}
$('eyeBtn').onclick=()=>{S.eye=!S.eye;save();eye();toEnd()};
const F=['entry','dir','tpk','slk','mb','mg','lev','fee','cap','per','ladn','ladm'];
const fillForm=p=>{F.forEach(k=>$('f_'+k).value=p[k]);$('f_lad').classList.toggle('on',!!p.lad)};
$('setBtn').onclick=()=>{fillForm(P);$('dr').classList.add('on')};
$('dr').onclick=e=>{if(e.target.hasAttribute('data-x'))$('dr').classList.remove('on')};
$('f_lad').onclick=()=>$('f_lad').classList.toggle('on');
$('f_reset').onclick=()=>fillForm(presetFor(S.preset==='custom'?'default':S.preset,S.tf));
$('f_ok').onclick=()=>{
  const n={};F.forEach(k=>{const v=$('f_'+k).value;n[k]=(k==='entry'||k==='dir')?v:Math.max(+v||0,0)});n.lad=$('f_lad').classList.contains('on');
  n.tpk=Math.max(n.tpk,.05);n.slk=Math.max(n.slk,.05);n.mg=Math.min(Math.max(n.mg,1),100);n.lev=Math.max(n.lev,1);n.cap=Math.max(n.cap,10);
  const ref=presetFor(S.preset==='custom'?'default':S.preset,S.tf),same=S.preset!=='custom'&&Object.keys(n).every(k=>n[k]==ref[k]);
  P=Object.assign({},P,n);if(!same)S.preset='custom';presetOpts();save();$('dr').classList.remove('on');recompute(true,true);
};
addEventListener('keydown',e=>{if(e.key==='Escape')$('dr').classList.remove('on')});
addEventListener('resize',()=>{markTf();setTab(S.tab)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&D.length)poll()});
presetOpts();markTf();setTab(S.tab);eye();
document.fonts&&document.fonts.ready.then(()=>{markTf();setTab(S.tab)});
load();
window.BTCV1={get D(){return D},get BT(){return BT},get P(){return P},get DW(){return DW},get PL(){return PL},backtest,OPTIMAL,DEWA,cs,tz};
})();
</script>
