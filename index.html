<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BTCUSDT v1</title>
<meta name="theme-color" content="#0b1020">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#0a0f1e;--s1:#0f1629;--s2:#141d36;--s3:#1a2544;--line:#1f2a4a;--line2:#2a3760;
  --ink:#e7eaf3;--mut:#8b95b5;--dim:#5e6888;
  --up:#2ec4a6;--dn:#ef6189;--acc:#5b8cff;--warn:#f2c94c;
  --r:10px;--hh:48px;--pw:340px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}

/* header: satu baris */
header{height:var(--hh);flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--s1);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;white-space:nowrap;position:relative}
header::-webkit-scrollbar{display:none}
.brand{font-weight:700;letter-spacing:-.01em;font-size:14px;margin-right:4px}
.brand span{color:var(--mut);font-weight:500}
.ctl{height:30px;background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:0 26px 0 10px;font-weight:600;font-size:12.5px;outline:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(100% - 13px) 13px,calc(100% - 9px) 13px;background-size:4px 4px;background-repeat:no-repeat;transition:border-color .2s}
.ctl:hover,.ctl:focus{border-color:var(--line2)}
.seg{position:relative;display:flex;height:30px;background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:2px;flex:none}
.seg button{position:relative;z-index:1;border:0;background:none;padding:0 10px;font-size:12px;font-weight:600;color:var(--mut);border-radius:6px;transition:color .2s}
.seg button.on{color:var(--ink)}
.seg .ind{position:absolute;top:2px;bottom:2px;border-radius:6px;background:var(--s3);box-shadow:inset 0 0 0 1px var(--line2);transition:transform .3s var(--ease),width .3s var(--ease)}
.sp{flex:1;min-width:8px}
.quote{display:flex;align-items:baseline;gap:8px}
.quote .p{font-size:15px;font-weight:600}
.quote .c{font-size:12px;font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;background:var(--up);flex:none;align-self:center;transition:background .3s}
.dot.off{background:var(--dn)}
.icon{width:30px;height:30px;flex:none;display:grid;place-items:center;border:1px solid var(--line);background:var(--s2);border-radius:8px;transition:background .2s}
.icon:hover{background:var(--s3)}
.icon svg{width:15px;height:15px;stroke:var(--ink);fill:none;stroke-width:1.6}
.prog{position:absolute;left:0;bottom:-1px;height:2px;width:30%;background:var(--acc);opacity:0;transform:translateX(-100%)}
body.busy .prog{opacity:1;animation:prog 1s var(--ease) infinite}
@keyframes prog{to{transform:translateX(400%)}}

/* layout 100% layar */
.app{flex:1;min-height:0;display:flex}
.chart{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;transition:opacity .35s var(--ease),filter .35s var(--ease)}
body.busy .chart{opacity:.45;filter:saturate(.6)}
.pn{position:relative;min-height:0}
.pn.a{flex:6}.pn.b{flex:1.7;border-top:1px solid var(--line)}.pn.c{flex:1.3;border-top:1px solid var(--line)}
.pn>.lc{position:absolute;inset:0}
.lab{position:absolute;left:10px;top:7px;z-index:3;pointer-events:none;font-size:11px;color:var(--mut);max-width:calc(100% - 100px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lab b{color:var(--ink);font-weight:600}
#ov{position:absolute;inset:0;z-index:2;pointer-events:none}
.tag{position:absolute;z-index:4;pointer-events:none;display:none;transform:translate(-50%,-100%);padding:5px 9px;border-radius:7px;white-space:nowrap;
  background:rgba(10,15,30,.86);border:1px solid var(--warn);box-shadow:0 0 0 3px rgba(242,201,76,.12);font-size:11.5px;transition:left .3s var(--ease),top .3s var(--ease)}
.tag b{color:var(--warn);font-weight:700;margin-right:6px}
.tag small{display:block;font-size:9.5px;color:var(--mut);letter-spacing:.04em;margin-top:2px;font-family:'JetBrains Mono',monospace}
.tag.s{border-color:var(--dn);box-shadow:0 0 0 3px rgba(239,97,137,.12)}.tag.s b{color:var(--dn)}
.tag.p{border-style:dashed;border-color:rgba(242,201,76,.55);box-shadow:none;background:rgba(10,15,30,.72)}
.tag.p.s{border-color:rgba(239,97,137,.55)}
.end{position:absolute;right:92px;bottom:8px;z-index:5;width:26px;height:26px;border-radius:7px;border:1px solid var(--line2);background:var(--s2);display:grid;place-items:center;opacity:.8;transition:opacity .2s}
.end:hover{opacity:1}.end svg{width:13px;height:13px;stroke:var(--ink);fill:none;stroke-width:1.8}
.err{position:absolute;inset:auto 12px 12px auto;z-index:6;background:var(--s2);border:1px solid var(--dn);border-radius:8px;padding:6px 10px;font-size:12px;display:none}

/* panel */
.side{width:var(--pw);flex:none;display:flex;flex-direction:column;gap:8px;padding:8px;border-left:1px solid var(--line);background:var(--s1);min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.card{background:var(--s2);border:1px solid var(--line);border-radius:var(--r);padding:12px;flex:none}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.fadein{animation:fi .35s var(--ease)}
@keyframes fi{from{opacity:0;transform:translateY(3px)}}

.pill{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:700;letter-spacing:.02em}
.pill.l{background:rgba(46,196,166,.14);color:var(--up)}.pill.s{background:rgba(239,97,137,.14);color:var(--dn)}
.pill.n{background:var(--s3);color:var(--mut)}.pill.w{background:rgba(242,201,76,.13);color:var(--warn)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:10px}
.kv div{min-width:0}.kv i{display:block;font-style:normal;font-size:11px;color:var(--mut)}
.kv span{font-size:13px;font-weight:600}
.pl{display:flex;align-items:baseline;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.pl .v{font-size:18px;font-weight:600}
.rail{position:relative;height:4px;border-radius:4px;margin:12px 0 4px;background:linear-gradient(90deg,var(--dn),#8d7bd6 50%,var(--up))}
.rail .t{position:absolute;top:-4px;width:2px;height:12px;background:var(--ink);opacity:.6;transform:translateX(-1px)}
.rail .k{position:absolute;top:-5px;width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--s2);transform:translateX(-7px);transition:left .5s var(--ease)}
.rl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut)}
.flat{color:var(--mut);margin-top:8px}

.eqrow{display:flex;align-items:baseline;gap:8px}
.eqv{font-size:24px;font-weight:600;letter-spacing:-.01em}
#eqc{display:block;width:100%;height:48px;margin:6px 0}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.st div{background:var(--s1);border-radius:7px;padding:6px 8px}
.st i{display:block;font-style:normal;font-size:10.5px;color:var(--mut)}
.st span{font-size:13px;font-weight:600}
.sqh{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:11px;color:var(--mut)}
.sq{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.sq b,.grid b{width:10px;height:10px;border-radius:2.5px;background:var(--up);cursor:pointer;animation:pop .32s var(--ease) backwards;transition:transform .15s}
.sq b:hover,.grid b:hover{transform:scale(1.35)}
.sq b.x,.grid b.x{background:var(--dn)}.sq b.t,.grid b.t{opacity:.5}
.sq b.o,.grid b.o{background:none;box-shadow:inset 0 0 0 1.5px var(--warn);animation:blink 1.2s ease-in-out infinite}
.grid{display:flex;flex-wrap:wrap;gap:3px;padding:2px 0 10px;border-bottom:1px solid var(--line);margin-bottom:2px}
.grid b{width:12px;height:12px}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes blink{50%{opacity:.35}}
.be{font-size:11px;color:var(--mut);margin-top:6px}
.hh{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:4px 0 8px}
.hh span+span{text-transform:none;letter-spacing:0;font-weight:500}

/* posisi rinci */
.dl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:3px 0;font-size:12px}
.dl>i{font-style:normal;color:var(--mut);flex:none}
.dl>i em,.dl em{font-style:normal;color:var(--dim);font-size:10.5px}
.dl>span{text-align:right;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;font-weight:600;min-width:0}
.warn{color:var(--warn)}
.rl3{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut)}
/* siklus trade */
.cy{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.stp{display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.stp::before{content:"";position:absolute;left:12.5%;right:12.5%;top:5px;height:2px;background:var(--line2)}
.stp div{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--dim);transition:color .3s}
.stp .dt{width:12px;height:12px;border-radius:50%;background:var(--s3);border:2px solid var(--line2);transition:background .3s,border-color .3s}
.stp b{font-size:10.5px;font-weight:600;margin-top:4px}
.stp em{font-style:normal;font-size:10px;opacity:.8}
.stp .ok{color:var(--mut)}.stp .ok .dt{background:var(--up);border-color:var(--up)}
.stp .bad{color:var(--mut)}.stp .bad .dt{background:var(--dn);border-color:var(--dn)}
.stp .on{color:var(--ink)}.stp .on .dt{background:var(--warn);border-color:var(--warn);animation:pl 1.4s ease-out infinite}
.stp .on.up .dt{background:var(--up);border-color:var(--up);--pc:46,196,166}.stp .on.dn .dt{background:var(--dn);border-color:var(--dn);--pc:239,97,137}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(var(--pc,242,201,76),.6)}100%{box-shadow:0 0 0 9px rgba(var(--pc,242,201,76),0)}}
.cy .bar{position:relative;height:6px;border-radius:6px;background:var(--s1);margin-top:10px;overflow:hidden}
.cy .bar i{position:absolute;top:0;bottom:0;border-radius:6px;transition:width .7s var(--ease)}
.cy .bar i.w{background:linear-gradient(90deg,rgba(242,201,76,.25),var(--warn))}
.cy .bar i.go{background-image:linear-gradient(90deg,var(--warn),#fff1bd,var(--warn));background-size:200% 100%;animation:flow 1.2s linear infinite}
.cy .bar i.g{background:linear-gradient(90deg,rgba(46,196,166,.4),var(--up))}.cy .bar i.r{background:linear-gradient(270deg,rgba(239,97,137,.4),var(--dn))}
.cy .bar .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);opacity:.7}
@keyframes flow{to{background-position:-200% 0}}
.cy .msg{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;margin-top:6px}
.cy .msg.mut{font-size:11px;margin-top:2px}
/* matriks akurasi */
.mx{display:grid;grid-template-columns:minmax(0,1fr) repeat(5,40px);gap:3px;align-items:center;font-size:11px}
.mx .h{color:var(--mut);text-align:center;font-weight:600;font-size:10.5px;padding-bottom:2px;border-bottom:2px solid var(--acc)}
.mx .h.swing{border-color:#8d7bd6}
.mx .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.mx .c{height:30px;border:0;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:11.5px;line-height:1.05;
  font-family:'JetBrains Mono',monospace;animation:pop .35s var(--ease) backwards;transition:transform .15s,box-shadow .2s;color:var(--ink);padding:0}
.mx .c i{font-style:normal;font-size:9px;opacity:.7;font-weight:500}
.mx .c.g{background:rgba(46,196,166,var(--a))}.mx .c.r{background:rgba(239,97,137,var(--a))}.mx .c.a{background:rgba(242,201,76,.2)}
.mx .c.z{background:var(--s1);color:var(--dim)}
.mx .c:hover{transform:scale(1.07)}.mx .c.on{box-shadow:0 0 0 2px var(--ink)}
.lg{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:11px;color:var(--mut)}
.lg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.lg b.g{background:var(--up)}.lg b.a{background:rgba(242,201,76,.6)}.lg b.r{background:var(--dn)}
.tr{cursor:pointer;transition:background .2s}.tr:hover{background:rgba(91,140,255,.05)}
.seg .gap{width:1px;align-self:stretch;margin:4px 3px;background:var(--line2);flex:none}
#fitBtn{width:auto;padding:0 9px;gap:5px;display:flex;align-items:center;font-size:12px;font-weight:600}
#fitBtn.spin svg{animation:fitA .5s var(--ease)}
@keyframes fitA{50%{transform:scale(.7)}}

.tabs{flex:1 0 340px;min-height:0;display:flex;flex-direction:column;padding:0}
.tb{position:relative;display:flex;border-bottom:1px solid var(--line);flex:none}
.tb button{flex:1;border:0;background:none;padding:10px 0 9px;font-size:12px;font-weight:600;color:var(--mut);transition:color .2s}
.tb button.on{color:var(--ink)}
.tb .ind{position:absolute;bottom:-1px;height:2px;background:var(--acc);border-radius:2px;transition:transform .3s var(--ease),width .3s var(--ease)}
.tb .mo{display:none}
.body{flex:1;min-height:0;overflow:auto;padding:8px 10px 10px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.sec{display:none}.sec.on{display:block;animation:fi .3s var(--ease)}

.tr{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:0}
.tr .b{font-size:10px;font-weight:700;text-align:center;border-radius:4px;padding:2px 0}
.tr .b.tp{background:rgba(46,196,166,.14);color:var(--up)}.tr .b.sl{background:rgba(239,97,137,.14);color:var(--dn)}.tr .b.op{background:rgba(242,201,76,.13);color:var(--warn)}
.tr .m{font-size:12px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .m i{font-style:normal;color:var(--mut);font-size:11px;display:block;white-space:normal;line-height:1.35}
.tr .r{text-align:right;font-size:12px;font-weight:600}
.tr .r i{display:block;font-style:normal;font-size:11px;color:var(--mut);font-weight:500}
.empty{color:var(--mut);padding:14px 2px}
table.vt{width:100%;border-collapse:collapse;font-size:12px}
.vt th{font-weight:500;color:var(--mut);text-align:right;padding:6px 4px;font-size:11px}
.vt td{text-align:right;padding:7px 4px;border-top:1px solid var(--line)}
.vt th:first-child,.vt td:first-child{text-align:left}
.vd{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--mut)}
.rules{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:12px}
.rules i{font-style:normal;color:var(--mut)}

/* Mata Dewa */
.dw{border-color:rgba(91,140,255,.35);background:linear-gradient(180deg,rgba(91,140,255,.10),rgba(91,140,255,.02)),var(--s2)}
.dw .hd span{color:var(--acc)}
.dwr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;font-size:12.5px}
.dwr>i{font-style:normal;color:var(--mut)}
.dwr b{font-weight:600}
.plan{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--s1);border:1px dashed var(--line2);font-size:12px;line-height:1.5}
.plan b{font-weight:600}
.meter{height:4px;border-radius:4px;background:var(--s1);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .6s var(--ease)}
.foot{font-size:11px;color:var(--dim);margin-top:6px}
#eyeBtn.on{border-color:var(--acc);background:rgba(91,140,255,.16)}
/* drawer pengaturan */
.dr{position:fixed;inset:0;z-index:50;pointer-events:none}
.dr .bk{position:absolute;inset:0;background:rgba(5,8,18,.5);opacity:0;transition:opacity .3s}
.dr .bx{position:absolute;right:0;top:0;bottom:0;width:min(360px,100%);background:var(--s1);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s var(--ease)}
.dr.on{pointer-events:auto}.dr.on .bk{opacity:1}.dr.on .bx{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600}
.fs{flex:1;overflow:auto;padding:6px 16px}
.f{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.f label{color:var(--mut)}
.f input,.f select{width:120px;height:30px;background:var(--s2);border:1px solid var(--line);border-radius:7px;padding:0 8px;text-align:right;outline:none;font-family:'JetBrains Mono',monospace;font-size:12.5px}
.f select{text-align:left;font-family:inherit}
.f input:focus,.f select:focus{border-color:var(--acc)}
.sw{width:36px;height:20px;border-radius:10px;border:0;background:var(--line2);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.sw.on{background:var(--dn)}.sw.on::after{transform:translateX(16px)}
.note{font-size:11.5px;color:var(--mut);padding:10px 0}
.df{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.bt{flex:1;height:34px;border-radius:8px;border:1px solid var(--line2);background:var(--s2);font-weight:600}
.bt.p{background:var(--acc);border-color:var(--acc);color:#fff}

@media (max-width:820px){
  :root{--hh:46px}
  header{padding:0 8px;gap:5px}
  .brand,.quote,.sp{display:none}
  .ctl{padding:0 20px 0 7px;font-size:12px;background-position:calc(100% - 11px) 13px,calc(100% - 7px) 13px;min-width:0;flex:1 1 auto;width:0}
  #sym{flex-basis:62px}#preset{flex-basis:100px}
  .seg button{padding:0 5px;font-size:11.5px}
  .app{flex-direction:column}
  .chart{flex:1.15}
  .side{width:auto;flex:1;border-left:0;border-top:1px solid var(--line);padding:0;gap:0;overflow:hidden}
  .side>.card:not(.tabs){display:none}
  .dw{border:0;background:none;padding:0}
  .tabs{border:0;border-radius:0;background:var(--s1);flex:1;min-height:0}
  .tb{overflow-x:auto;scrollbar-width:none}.tb::-webkit-scrollbar{display:none}
  .tb button{flex:none;padding:10px 11px 9px}
  .tb .mo{display:block}
  #fitBtn span{display:none}
  .end{width:32px;height:32px;opacity:.95}
  .mx{grid-template-columns:minmax(0,1fr) repeat(5,minmax(38px,52px))}
  .end{right:84px}
  .pn.b{flex:1.5}.pn.c{display:none}
}
@media (max-width:480px){#fitBtn,.seg .gap{display:none}}
@media (max-height:760px) and (min-width:821px){#eqc{height:40px}.card{padding:10px}.kv{gap:6px 12px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">BTCUSDT <span>v1</span></div>
  <select id="sym" class="ctl" aria-label="Simbol"></select>
  <div class="seg" id="tfs"><span class="ind"></span></div>

  pull_e20:{n:'Pullback EMA20',r:'Tren naik, low menyentuh EMA20, close di atas EMA50 · short kebalikannya',f:(X,i)=>up(X,i)&&X.l[i]<=X.e20[i]&&X.c[i]>X.e50[i]?1:dw(X,i)&&X.h[i]>=X.e20[i]&&X.c[i]<X.e50[i]?-1:0},

  '30m':Object.assign({},BASE,{entry:'rsi14_dip',dir:'L',tpk:2,slk:4,mb:0,per:60}),    // 71/72/73%
  '1h':Object.assign({},BASE,{entry:'rsi2_htf5',dir:'L',tpk:1.5,slk:3,mb:0,per:90}),   // 68/69/69%
  '4h':Object.assign({},BASE,{entry:'trend200',dir:'L',tpk:1.5,slk:3,mb:0,per:365}),   // 73/70/71%
  '1d':Object.assign({},BASE,{entry:'trend200',dir:'L',tpk:1.5,slk:3,mb:0,per:365})    // 76/74/74%

  '1h':Object.assign({},OPTIMAL['1h'],{entry:'dewa',base:'rsi2_htf5',thr:.7}),

  '1d':Object.assign({},OPTIMAL['1d'],{entry:'dewa',base:'all',thr:.75,per:365})
};
const RISET={ // backtest skrip riset: n trade, WR 60% awal / 40% akhir, WR ETH, rentang
  '15m':[132,87,90,83,'2,5 thn'],'30m':[161,71,72,73,'3,5 thn'],'1h':[273,68,69,69,'6 thn'],'4h':[874,73,70,71,'2017–2026'],'1d':[160,76,74,74,'2017–2026']};
/* Scalping 15m–1H & Swing 4H–1D: dipilih dari 54.600 (scalp) / 14.560 (swing) kombinasi per TF.
   Lolos hanya bila BTC 60% awal, BTC 40% akhir, ETH, dan SOL semuanya untung setelah fee; diurutkan dari win rate terendah di keempatnya. */
const SCALP={
  '15m':Object.assign({},BASE,{entry:'rsi2_htf3',dir:'L',tpk:1,slk:4,mb:0,per:0}),
  '30m':Object.assign({},BASE,{entry:'sc_stoch10',dir:'L',tpk:.5,slk:4,mb:0,per:0}),
  '1h':Object.assign({},BASE,{entry:'sc_stoch5',dir:'L',tpk:.5,slk:2,mb:0,per:0})
};
const SWING={
  '4h':Object.assign({},BASE,{entry:'sw_rsi2',dir:'LS',tpk:.5,slk:4,mb:0,per:0}),
  '1d':Object.assign({},BASE,{entry:'sw_dn3',dir:'L',tpk:.5,slk:4,mb:0,per:0})
};
const RISET2={ // rentang BTC, lalu [trade, WR%] untuk BTC awal 60% / BTC akhir 40% / ETH / SOL
  '15m':['2024–2026',[82,87],[49,90],[230,83],[277,87]],'30m':['2023–2026',[104,96],[34,94],[266,93],[475,92]],
  '1h':['2020–2026',[69,81],[54,89],[145,85],[235,83]],'4h':['2017–2026',[174,90],[123,93],[327,90],[212,90]],
  '1d':['2019–2026',[35,94],[37,92],[60,92],[37,89]]};
const GRP=tf=>tf==='4h'||tf==='1d'?'swing':'scalp';
const PNAME={scalp:'Scalping',swing:'Swing',dewa:'Mata Dewa',optimal:'Optimal',default:'Default',custom:'Kustom'};
const presetFor=(id,tf)=>Object.assign({},id==='scalp'?SCALP[tf]||SCALP['30m']:id==='swing'?SWING[tf]||SWING['4h']:id==='optimal'?OPTIMAL[tf]:id==='dewa'?DEWA[tf]:DEFAULT);
const w0=n=>Math.min(801,Math.max(201,n>>2)); // pemanasan EMA800

let S=Object.assign({sym:'BTCUSDT',tf:'30m',tab:'hist',eye:true},LS.get('s2',{}),LS.get('s3',{}));
if(!TFMS[S.tf])S.tf='30m';
if(!LS.get('s3',null))S.preset=GRP(S.tf);

let D=[],X=null,BT=null,pollT=null,seq=0,lastEq=null,DW=null,dwKey='',dwSeq=0;

/* indikator */
function ema(a,n){const k=2/(n+1),o=[a[0]];for(let i=1;i<a.length;i++)o.push(o[i-1]+k*(a[i]-o[i-1]));return o}
function rma(a,n){const o=new Array(a.length);let s=0;for(let i=0;i<a.length;i++){if(i<n){s+=a[i];o[i]=s/(i+1)}else o[i]=o[i-1]+(a[i]-o[i-1])/n}return o}
function calc(d){
  const o=d.map(r=>r.o),h=d.map(r=>r.h),l=d.map(r=>r.l),c=d.map(r=>r.c);
  const tr=c.map((x,i)=>i?Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])):h[i]-l[i]);
  const e12=ema(c,12),e26=ema(c,26),m=e12.map((x,i)=>x-e26[i]),s=ema(m,9);
  const ch=c.map((x,i)=>i?x-c[i-1]:0);
  const RS={},rsi=n=>{const g=rma(ch.map(x=>Math.max(x,0)),n),L=rma(ch.map(x=>Math.max(-x,0)),n);RS[n]=[g,L];return g.map((x,i)=>100-100/(1+x/(L[i]||1e-12)))};
  const r14=rsi(14),r2=rsi(2);
  const bbl=[],bbu=[];
  for(let i=0;i<c.length;i++){const a=Math.max(0,i-19);let sm=0,q=0;for(let j=a;j<=i;j++)sm+=c[j];const mu=sm/(i-a+1);for(let j=a;j<=i;j++)q+=(c[j]-mu)**2;const sd=Math.sqrt(q/(i-a+1));
    const ma=i>=19?mu:sm/20;bbl.push(ma-2*sd);bbu.push(ma+2*sd)}
  const stk=c.map((x,i)=>{if(i<13)return 50;let H=-Infinity,L=Infinity;for(let j=i-13;j<=i;j++){if(h[j]>H)H=h[j];if(l[j]<L)L=l[j]}return H>L?(x-L)/(H-L+1e-12)*100:50});
  return {o,h,l,c,atr:rma(tr,14),m,s,hi:m.map((x,i)=>x-s[i]),rsi:r14,rsi2:r2,stk,e20:ema(c,20),e50:ema(c,50),e200:ema(c,200),e800:ema(c,800),bbl,bbu,
    e12,e26,ag14:RS[14][0],al14:RS[14][1],ag2:RS[2][0],al2:RS[2][1]};
}

/* backtest — sama dengan skrip riset */
function backtest(p,from,to,live,Z){
  Z=Z||X;const sig=ENTRIES[p.entry].f,lev=p.lev,fee=p.fee/100;
  let eq=p.cap,peak=eq,mdd=0,streak=0,i=Math.max(from,w0(Z.c.length)),open=null;const T=[],curve=[eq];
  while(i<to-1){
    let s=sig(Z,i);if(p.dir==='L'&&s<0)s=0;
    if(!s){i++;continue}
    const e=Z.o[i+1],a=Z.atr[i],tp=e+s*p.tpk*a,sl=e-s*p.slk*a,mg=(p.lad&&streak>=p.ladn?p.ladm:p.mg)/100;
    let j=i+1,res=null;
    for(;j<to;j++){
      const hs=s>0?Z.l[j]<=sl:Z.h[j]>=sl,ht=s>0?Z.h[j]>=tp:Z.l[j]<=tp;
      if(live&&j===to-1&&!hs&&!ht)break;
      if(hs){res=['SL',sl];break}
      if(ht){res=['TP',tp];break}
      if(p.mb&&j-i>=p.mb&&!(live&&j===to-1)){res=['T',Z.c[j]];break}
    }
    const b={dir:s,si:i,ei:i+1,entry:e,tp,sl,atr:a,mg,eq0:eq,lad:mg*100>p.mg};
    if(!res){if(live)open=b;break}
    const gross=s*(res[1]-e)/e*mg*lev,fr=fee*2*mg*lev,net=gross-fr;
    eq=Math.max(eq*(1+net),0);peak=Math.max(peak,eq);mdd=Math.max(mdd,1-eq/peak);
    T.push(Object.assign(b,{type:res[0],exit:res[1],xi:j,bars:j-i,gross,fr,net,eq}));curve.push(eq);
    streak=net<0?streak+1:0;i=j;if(eq<=0)break;
  }
  const w=T.filter(t=>t.net>0).length;
  return {T,open,eq,ret:eq/p.cap-1,mdd,wr:T.length?w/T.length:0,w,streak,curve};
}

/* data Binance */
const HOSTS=['https://data-api.binance.vision','https://api.binance.com'];
async function kl(q){let er;for(const h of HOSTS){try{const r=await fetch(h+'/api/v3/klines?'+q,{cache:'no-store'});if(r.ok)return r.json();er=new Error('HTTP '+r.status)}catch(e){er=e}}throw er}
const bar=r=>({t:r[0],o:+r[1],h:+r[2],l:+r[3],c:+r[4]});
async function loadAll(sym,tf){

  const parts=await Promise.all([...Array(K)].map((_,k)=>kl(`symbol=${sym}&interval=${tf}&limit=1000&startTime=${Math.floor(now-(K-k)*1000*ms)}`).catch(()=>[])));
  const m=new Map();parts.flat().forEach(r=>m.set(r[0],r));
  return [...m.values()].sort((a,b)=>a[0]-b[0]).map(bar);
}

  for(let i=Math.max(600,L-500-HZ);i<=L-HZ;i++){if(PR[i]>=.7&&!isNaN(lab[i])){cn++;ch+=lab[i]}}
  let bh=0,bn=0;for(let i=Math.max(600,L-500-HZ);i<=L-HZ;i++)if(!isNaN(lab[i])){bn++;bh+=lab[i]}
  DW={L,PR,q,acc:dn?dh/dn:NaN,accN:dn,cal:cn?ch/cn:NaN,calN:cn,base:bn?bh/bn:NaN,tpk:P.tpk,slk:P.slk};dwKey=key;return true;
}
/* evaluasi sinyal di bar berjalan bila close = cH (tanpa hitung ulang seluruh data) */
function hypo(cH,fn){
  const i=D.length-1,b=D[i],K=['c','h','l','e20','e50','e200','e800','e12','e26','m','s','hi','rsi','rsi2','ag14','al14','ag2','al2','atr','bbl','bbu','stk'],sv={};
  K.forEach(k=>sv[k]=X[k][i]);
  const E=(k,n)=>X[k][i]=X[k][i-1]+2/(n+1)*(cH-X[k][i-1]),ch=cH-X.c[i-1];
  X.c[i]=cH;X.h[i]=Math.max(b.h,cH);X.l[i]=Math.min(b.l,cH);[['e20',20],['e50',50],['e200',200],['e800',800],['e12',12],['e26',26]].forEach(([k,n])=>E(k,n));
  X.m[i]=X.e12[i]-X.e26[i];X.s[i]=X.s[i-1]+.2*(X.m[i]-X.s[i-1]);X.hi[i]=X.m[i]-X.s[i];
  const R=(n,g,l)=>{X[g][i]=X[g][i-1]+(Math.max(ch,0)-X[g][i-1])/n;X[l][i]=X[l][i-1]+(Math.max(-ch,0)-X[l][i-1])/n;return 100-100/(1+X[g][i]/(X[l][i]||1e-12))};
  X.rsi[i]=R(14,'ag14','al14');X.rsi2[i]=R(2,'ag2','al2');
  const tr=Math.max(X.h[i]-X.l[i],Math.abs(X.h[i]-X.c[i-1]),Math.abs(X.l[i]-X.c[i-1]));X.atr[i]=X.atr[i-1]+(tr-X.atr[i-1])/14;
  {let H=-Infinity,L=Infinity;for(let j=i-13;j<=i;j++){H=Math.max(H,X.h[j]);L=Math.min(L,X.l[j])}X.stk[i]=H>L?(cH-L)/(H-L+1e-12)*100:50}
  let sm=0,qq=0;for(let j=i-19;j<=i;j++)sm+=X.c[j];const mu=sm/20;for(let j=i-19;j<=i;j++)qq+=(X.c[j]-mu)**2;const sd=Math.sqrt(qq/20);X.bbl[i]=mu-2*sd;X.bbu[i]=mu+2*sd;
  const r=fn(X,i);K.forEach(k=>X[k][i]=sv[k]);return r;
}
function plan(){
  const i=D.length-1,c0=D[i].c,a=X.atr[i-1],base=P.entry==='dewa'?(P.base&&P.base!=='all'?ENTRIES[P.base].f:()=>1):ENTRIES[P.entry].f;
  const fn=(Y,k)=>{const s=base(Y,k);return P.dir==='L'?s>0:s!==0},now=hypo(c0,fn);let best=null;
  if(!now)for(let k=1;k<=48&&best==null;k++)for(const sg of[-1,1]){const p=c0+sg*k*a/12;if(p>0&&hypo(p,fn)){best=p;break}}
  const px=now?c0:best;if(px==null)return null;
  const s=P.dir==='L'?1:(hypo(px,(Y,k)=>base(Y,k))>0?1:-1);
  return {now,px,dir:s,tp:px+s*P.tpk*a,sl:px-s*P.slk*a};
}
function start(){const s0=w0(D.length);if(!P.per)return s0;const t0=D[D.length-1].t-P.per*864e5;const i=D.findIndex(b=>b.t>=t0);return Math.max(i<0?0:i,s0)}
function recompute(keep,anim){
  X=calc(D);PL=plan();BT=backtest(P,start(),D.length,true);fill(keep);head();renderPanel(anim);drawOv();
  dewaRun().then(ch=>{if(!ch)return;if(P.entry==='dewa'){PL=plan();BT=backtest(P,start(),D.length,true);markers();posLines();renderPanel(false)}else renderDewa();drawOv()});
}
let PL=null;
function tick(){
  const l=D[D.length-1],i=D.length-1;X=calc(D);
  cs.update({time:tz(l.t),open:l.o,high:l.h,low:l.l,close:l.c});
  const v=X.hi[i],k=v>X.hi[i-1];mh.update({time:tz(l.t),value:v,color:v>=0?(k?UP:'rgba(46,196,166,.4)'):(k?'rgba(239,97,137,.4)':DN)});
  mm.update({time:tz(l.t),value:X.m[i]});msg.update({time:tz(l.t),value:X.s[i]});rs.update({time:tz(l.t),value:X[osc().k][i]});
  const o=BT.open;if(o&&(o.dir>0?(l.l<=o.sl||l.h>=o.tp):(l.h>=o.sl||l.l<=o.tp))){recompute(true,true);return}
  head();PL=plan();renderDewa();posLines();
  const pk=PL?[PL.px.toFixed(6),PL.now,PL.dir].join():'';
  if(!o&&pk!==plKey){const h=posHTML();[$('cPos'),$('mPos')].forEach(el=>el.innerHTML=h);plKey=pk;cdTick()}else updCy();
  if(o){const mg=o.mg,fl=o.dir*(l.c-o.entry)/o.entry*mg*P.lev-P.fee/100*2*mg*P.lev,lo=Math.min(o.sl,o.tp),hi=Math.max(o.sl,o.tp);
    document.querySelectorAll('#fl').forEach(e=>{e.textContent=pc(fl)+' · '+fd(o.eq0*(1+fl));e.className=fl>=0?'up':'dn'});
    document.querySelectorAll('#lp').forEach(e=>e.textContent=fp(l.c));
    document.querySelectorAll('#kn').forEach(e=>e.style.left=Math.min(100,Math.max(0,(l.c-lo)/(hi-lo)*100))+'%');
    document.querySelectorAll('[data-c]').forEach(curve)}
  drawOv();
}
function toEnd(){const n=D.length,w=$('c1').clientWidth,show=Math.max(40,Math.min(160,Math.round(w/8))),ex=S.eye?PH+6:5,r={from:n-show,to:n+ex};[c1,c2,c3].forEach(c=>c.timeScale().setVisibleLogicalRange(r))}
/* Auto: kembali ke bar terakhir di kanan + skala harga otomatis 100% di semua panel */
function fit(){
  [c1,c2,c3].forEach(c=>{c.priceScale('right').applyOptions({autoScale:true,scaleMargins:c===c1?{top:.1,bottom:.08}:{top:.12,bottom:.08}});c.timeScale().applyOptions({rightOffset:S.eye?PH+6:6})});
  toEnd();const b=$('fitBtn');b.classList.remove('spin');void b.offsetWidth;b.classList.add('spin');drawOv();
}
async function load(){
  const my=++seq;document.body.classList.add('busy');clearInterval(pollT);$('err').style.display='none';
  try{
    const d=await loadAll(S.sym,S.tf);if(my!==seq)return;if(d.length<300)throw new Error('data kurang');
    D=d;lastEq=null;DW=null;dwKey='';HL=null;recompute(false,true);fit();requestAnimationFrame(()=>requestAnimationFrame(toEnd));
    if(S.tab==='acc'&&(!MX||MX.sym!==S.sym))loadMx();
    $('dot').classList.remove('off');pollT=setInterval(poll,5000);
  }catch(e){$('err').textContent='Gagal memuat data · mencoba lagi';$('err').style.display='block';$('dot').classList.add('off');setTimeout(()=>my===seq&&load(),6000)}
  finally{if(my===seq)document.body.classList.remove('busy')}
}
async function poll(){
  const my=seq;
  try{const d=(await kl(`symbol=${S.sym}&interval=${S.tf}&limit=2`)).map(bar);if(my!==seq||!D.length)return;$('dot').classList.remove('off');
    let nb=false;d.forEach(b=>{const L=D[D.length-1];if(b.t===L.t)D[D.length-1]=b;else if(b.t>L.t){D.push(b);nb=true}});nb?recompute(true,false):tick()}
  catch(e){$('dot').classList.add('off')}
}

/* kontrol */
function moveInd(box,btn){const ind=box.querySelector('.ind');if(!btn||!ind)return;ind.style.width=btn.offsetWidth+'px';ind.style.transform=`translateX(${btn.offsetLeft-(box.classList.contains('seg')?0:0)}px)`}
$('tfs').insertAdjacentHTML('beforeend',TFS.map(([k,l])=>(k==='4h'?'<span class="gap"></span>':'')+`<button data-tf="${k}" title="${GRP(k)==='scalp'?'Scalping':'Swing'} · klik lagi untuk Auto">${l}</button>`).join(''));
$('sym').innerHTML=SYMS.map(s=>`<option value="${s}" ${s===S.sym?'selected':''}>${s.replace('USDT','')}</option>`).join('');
function presetOpts(){const m=innerWidth<=480;$('preset').innerHTML=`<option value="scalp">${m?'Scalp':'Scalping · 15m–1H'}</option><option value="swing">${m?'Swing':'Swing · 4H–1D'}</option><option value="dewa">${m?'Dewa':'Mata Dewa'}</option><option value="optimal">Optimal</option><option value="default">Default</option>${S.preset==='custom'?'<option value="custom">Kustom</option>':''}`;$('preset').value=S.preset}
$('f_entry').innerHTML=Object.entries(ENTRIES).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('');
function markTf(){const b=[...$('tfs').querySelectorAll('button')];b.forEach(x=>x.classList.toggle('on',x.dataset.tf===S.tf));moveInd($('tfs'),b.find(x=>x.dataset.tf===S.tf))}
function setTab(t){
  const mob=innerWidth<=820;if(!mob&&(t==='pos'||t==='eq'||t==='dewa'))t='hist';S.tab=t;
  document.querySelectorAll('#tb button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));

}
const save=()=>{LS.set('s3',S);if(S.preset==='custom')LS.set('custom',P)};
$('tfs').onclick=e=>{const tf=e.target.dataset.tf;if(!tf)return;if(tf===S.tf){fit();return}
  S.tf=tf;if(S.preset==='scalp'||S.preset==='swing')S.preset=GRP(tf);if(S.preset!=='custom')P=presetFor(S.preset,tf);presetOpts();markTf();save();load()};
$('sym').onchange=e=>{S.sym=e.target.value;MX=null;save();load()};
$('preset').onchange=e=>{S.preset=e.target.value;let tfc=false;
  if((S.preset==='scalp'||S.preset==='swing')&&GRP(S.tf)!==S.preset){S.tf=S.preset==='scalp'?'30m':'4h';tfc=true;markTf()}
  if(S.preset!=='custom')P=presetFor(S.preset,S.tf);presetOpts();save();
  if(tfc){load();return}
  document.body.classList.add('busy');setTimeout(()=>{if(D.length)recompute(true,true);document.body.classList.remove('busy')},180)};
$('tb').onclick=e=>{if(e.target.dataset.t)setTab(e.target.dataset.t)};
$('end').onclick=fit;$('fitBtn').onclick=fit;$('c1').addEventListener('dblclick',fit);
const onTrade=e=>{const b=e.target.closest('[data-k]');if(b){focusTrade(b.dataset.k)}};
$('sHist').onclick=onTrade;['cEq','mEq'].forEach(id=>$(id).onclick=onTrade);
$('sAcc').onclick=e=>{const b=e.target.closest('[data-e]');if(b)useCell(b.dataset.e,b.dataset.tf)};
function eye(){$('eyeBtn').classList.toggle('on',!!S.eye);[c1,c2,c3].forEach(c=>c.timeScale().applyOptions({rightOffset:S.eye?PH+6:6}));drawOv()}
$('eyeBtn').onclick=()=>{S.eye=!S.eye;save();eye();toEnd()};
const F=['entry','dir','tpk','slk','mb','mg','lev','fee','cap','per','ladn','ladm'];

};
addEventListener('keydown',e=>{if(e.key==='Escape')$('dr').classList.remove('on')});
addEventListener('resize',()=>{markTf();setTab(S.tab);presetOpts()});

document.fonts&&document.fonts.ready.then(()=>{markTf();setTab(S.tab)});
